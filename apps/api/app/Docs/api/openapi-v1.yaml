    SiteHeaderContent: { type: object, description: El enlace de clave informacion es obligatorio. Su etiqueta y destino se normalizan a Información y #preguntas-frecuentes; abre un submenú estructural con Reglamento, Cómo participar, Calendario y Preguntas frecuentes. Cómo participar apunta a #edicion-vigente y Reglamento abre el PDF publicado en Edición vigente en una pestaña nueva. La clave calendario y cualquier enlace principal con destino #calendario se rechazan. Acerca se presenta y guarda después de Galería y antes de Contacto cuando existen; sus etiquetas y destinos se conservan., required: [home_label, slogan, links], properties: { home_label: { type: string, maxLength: 120 }, slogan: { type: string, maxLength: 120 }, links: { type: array, items: { $ref: '#/components/schemas/EditorialLink' } } }, additionalProperties: false }
